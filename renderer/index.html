<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: dsmedia:; media-src 'self' blob: dsmedia:; font-src 'self' data:; connect-src 'self' data: blob: dsmedia:">
  <title>Design Studio</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- ============ HOME / DASHBOARD ============ -->
  <section id="home" class="view">
    <nav class="home-nav">
      <div class="brand"><span class="brand-mark">◆</span> Design Studio</div>
      <button class="btn primary wide" id="btn-create">＋ Create a design</button>
      <div class="nav-list" id="home-nav-list"></div>
      <div class="nav-foot" id="app-version"></div>
    </nav>
    <main class="home-main" id="home-main"></main>
  </section>

  <!-- ============ EDITOR ============ -->
  <section id="editor" class="view hidden">
    <header class="topbar">
      <button class="tb-btn" id="tb-home" title="Home (Ctrl+H)"><span data-icon="home"></span> Home</button>
      <div class="tb-sep"></div>
      <button class="tb-btn icon" id="tb-undo" title="Undo (Ctrl+Z)"><span data-icon="undo"></span></button>
      <button class="tb-btn icon" id="tb-redo" title="Redo (Ctrl+Y)"><span data-icon="redo"></span></button>
      <button class="tb-btn" id="tb-resize" title="Change canvas size"><span data-icon="resize"></span> Resize</button>
      <div class="tb-title">
        <input id="doc-name" spellcheck="false" title="Rename design">
        <span id="save-status" class="save-status"></span>
      </div>
      <div class="tb-format" id="doc-format"></div>
      <button class="tb-btn" id="tb-save" title="Save (Ctrl+S)"><span data-icon="save"></span> Save</button>
      <button class="tb-btn accent" id="tb-export" title="Export (Ctrl+E)"><span data-icon="download"></span> Export</button>
    </header>

    <div class="editor-body">
      <aside class="rail" id="rail"></aside>
      <aside class="left-panel" id="left-panel"></aside>

      <div class="work-wrap">
        <div class="ctx-bar" id="ctx-bar"></div>
        <div class="workspace" id="workspace">
          <div class="stage" id="stage">
            <div class="page-holder" id="page-holder">
              <div id="page-svg"></div>
              <svg id="overlay" class="overlay"></svg>
              <textarea id="text-editor" class="text-editor hidden" spellcheck="true"></textarea>
            </div>
          </div>
        </div>
        <footer class="page-bar">
          <div class="pages" id="pages"></div>
          <div class="zoom-ctl">
            <button class="tb-btn icon small" id="zoom-out" title="Zoom out (Ctrl -)">−</button>
            <input type="range" id="zoom-range" min="5" max="400" value="100">
            <button class="tb-btn icon small" id="zoom-in" title="Zoom in (Ctrl +)">＋</button>
            <button class="tb-btn small" id="zoom-label" title="Fit to screen (Ctrl 0)">100%</button>
          </div>
        </footer>
      </div>

      <aside class="right-panel" id="right-panel"></aside>
    </div>
  </section>

  <input type="file" id="file-input" accept="image/*,video/*,audio/*,.mkv,.avi,.wmv,.mov,.m4a,.flac,.opus" multiple hidden>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/formats.js"></script>
  <script src="js/document.js"></script>
  <script src="js/render.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/video.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
